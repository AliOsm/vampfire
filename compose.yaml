name: vampfire
services:
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    network_mode: host
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:size=4m
      - /data:size=16m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/up"]
      interval: 10s
      timeout: 3s
      retries: 6
